name: Build & Release Desktop

# 推送 main 或 v* 标签、或手动触发时，于三个平台构建桌面安装包，
# 再统一发布到 GitHub Releases（单一发布任务，避免并发写同一 Release 的竞争）。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build desktop (no publish)
        # 仅打包，不发布；发布交由统一的 release 任务，避免三平台并发写同一 Release
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifacts (files only, no unpacked dirs)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          # 只上传产物文件，排除 linux-unpacked/mac/win-unpacked 等解包目录与 builder-debug.yml
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts (flattened)
        # merge-multiple 将所有矩阵产物直接扁平合并进 out/，避免子目录导致 glob 失配
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to GitHub Releases (idempotent, never deletes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          NOTES="## WB Convo Flow ${TAG}

          桌面端原生安装包（Electron 封装，开箱即用、无额外环境依赖）。

          | 平台 | 文件 |
          |------|------|
          | Windows | WB Convo Flow-${VERSION}-setup.exe (NSIS) |
          | macOS | WB Convo Flow-${VERSION}-x64.dmg / -arm64.dmg (+ .zip) |
          | Linux | WB Convo Flow-${VERSION}-x86_64.AppImage (通用包；.deb 可在本地具备 dpkg/fakeroot 时启用) |

          macOS 安装包为未签名构建（仓库未配置 Apple 证书）。首次打开若被拦截：访达中右键打开，或执行 xattr -cr 解除隔离。"

          FILTER='out -maxdepth 1 -type f ! -name builder-debug.yml'
          echo "== collected installer files =="
          find $FILTER -printf '  %f\n'

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "== release $TAG exists -> upload (clobber) =="
            find $FILTER -print0 | xargs -0 -r gh release upload "$TAG" --clobber
            PUB_RC=$?
          else
            echo "== create release $TAG =="
            find $FILTER -print0 | xargs -0 -r gh release create "$TAG" --title "WB Convo Flow $TAG" --notes "$NOTES" --latest
            PUB_RC=$?
          fi

          if [ "$PUB_RC" != "0" ]; then
            echo "== PUBLISH FAILED (rc=$PUB_RC); opening debug issue via REST API =="
            {
              echo "FILES:"; find $FILTER -printf '  %f\n'
              echo "gh release view:"; gh release view "$TAG" 2>&1 || true
            } 2>&1 | tee /tmp/pub.log
            curl -sk --noproxy '*' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"title\":\"CI publish debug $(date -u +%H%M%SZ)\",\"body\":$(python3 -c "import json,sys;print(json.dumps(open('/tmp/pub.log',encoding='utf-8',errors='replace').read()))")}" \
              https://api.github.com/repos/LinZhaorui/wb-convo-flow/issues || echo "(failed to open diagnostic issue)"
            exit 1
          fi
          echo "发布完成: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Close diagnostic issues on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --search "in:title CI publish debug" --state open --json number -q '.[].number' 2>/dev/null); do
            gh issue close "$n" --comment "resolved by fix" || true
          done
