name: Build & Release Desktop

# 在推送版本标签（v*）或手动触发时，于三个平台 runner 上构建桌面安装包，
# 并用 GITHUB_TOKEN 自动发布到 GitHub Releases。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build & publish (Electron)
        # electron-builder 在本平台构建并自动发布到 Releases
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 仓库未配置 Apple 证书，关闭自动签名发现，产出未签名安装包
          CSC_IDENTITY_AUTO_DISCOVERY: false
